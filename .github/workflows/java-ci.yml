name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests - ${{ matrix.test-suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-suite: AccountService (4 passed)
            test-class: AccountServiceTest
          - test-suite: StudentService (4 passed)
            test-class: StudentServiceTest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run ${{ matrix.test-suite }} unit tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -Dtest=${{ matrix.test-class }} test

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test-class }}-reports
          path: target/surefire-reports/
          if-no-files-found: error

  database-integration-tests:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Spring Boot and H2 integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -Dtest=DatabaseIntegrationTest test

      - name: Upload integration-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-integration-test-reports
          path: target/surefire-reports/
          if-no-files-found: error
