spring.application.name=university-management
server.port=8080

# Defaults to in-memory H2 for local runs.
# In Docker these are overridden by SPRING_DATASOURCE_* environment variables (PostgreSQL).
spring.datasource.url=jdbc:h2:mem:university;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# First admin account, created only when no admin exists
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.seed-demo-data=${SEED_DEMO_DATA:true}
